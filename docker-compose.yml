version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: grading-system-postgres
    environment:
      POSTGRES_USER: grading_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: grading_system
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grading_user -d grading_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grading-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: grading-system-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grading-network
    restart: unless-stopped

  # NestJS Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grading-system-api
    environment:
      # Application
      NODE_ENV: development
      APP_PORT: 3000
      APP_NAME: AI Grading System
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: grading_user
      DB_PASSWORD: ${DB_PASSWORD:-postgres_dev_password}
      DB_NAME: grading_system
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      REDIS_DB: 0
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_min_32_chars_required}
      JWT_EXPIRATION: 3600
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_min_32_chars_required}
      JWT_REFRESH_EXPIRATION: 2592000
      
      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_min_32_chars_required}
      
      # AI Providers
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      
      # S3 Configuration
      S3_BUCKET: ${S3_BUCKET:-grading-system-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      
      # Logging
      LOG_LEVEL: debug
      
      # CORS
      CORS_ORIGIN: http://localhost:3001,http://localhost:3000
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/dist:/app/dist
    networks:
      - grading-network
    restart: unless-stopped
    command: npm run start:dev

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: grading-system-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - grading-network
    restart: unless-stopped

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: grading-system-redis-commander
    environment:
      REDIS_HOSTS: default:redis:6379:0:${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - grading-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  grading-network:
    driver: bridge
